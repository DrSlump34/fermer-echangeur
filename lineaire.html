<style>
/* ===== Thème ===================================================================== */
:root {
  --fond: #f4f6fa; --surface: #ffffff; --surface-2: #eef1f6; --bord: #dde3ec; --texte: #0e1726; --doux: #5b6779;
  --accent: #2563eb; --accent-2: #60a5fa; --rouge: #e11d2e; --rouge-doux: #fde8ea; --vert: #10b981; --ambre: #f59e0b;
  --panneau: #1f4fbf; --cartouche: #d91c2a; --chaussee: #9aa5b5; --chaussee-fort: #475569; --ombre: 0 1px 2px rgb(15 23 42 / .06), 0 8px 24px rgb(15 23 42 / .08);
  --r: 14px; --t: 160ms cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root { --fond: #0b1220; --surface: #111a2b; --surface-2: #162236; --bord: #23324a; --texte: #e6ecf5; --doux: #93a1b8;
    --accent: #60a5fa; --accent-2: #93c5fd; --rouge-doux: #3a1218; --chaussee: #46566e; --chaussee-fort: #9fb0c8; --ombre: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .35); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--texte); background: var(--fond); }
button, input, select { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
kbd { font: 600 11px/1 ui-monospace, monospace; padding: 3px 6px; border: 1px solid var(--bord); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); color: var(--doux); }

/* ===== Signalisation : cartouche rouge (numéro d'autoroute), panneau bleu (sens) ===== */
.cartouche { display: inline-grid; place-items: center; min-width: 46px; height: 30px; padding: 0 9px; border-radius: 7px; background: var(--cartouche); color: #fff; font-weight: 800; letter-spacing: .02em; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .9), 0 0 0 1px var(--cartouche); }
.cartouche.anneau { background: #0f766e; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .9), 0 0 0 1px #0f766e; }
.panneau { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: var(--panneau); color: #fff; font-weight: 700; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .85), 0 0 0 1px var(--panneau); white-space: nowrap; }
.num { display: inline-grid; place-items: center; min-width: 34px; height: 26px; padding: 0 6px; border-radius: 6px; background: #fff; color: #111; font-weight: 800; font-size: 13px; box-shadow: 0 0 0 2px #111; }
.num.aire { background: #047857; color: #fff; box-shadow: none; }
.num.bif { background: var(--cartouche); color: #fff; box-shadow: none; font-size: 11px; }
.num.autre { background: var(--surface-2); color: var(--doux); box-shadow: 0 0 0 1px var(--bord); font-size: 11px; }

/* ===== Mise en page bureau ========================================================= */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; height: 100dvh; }
.barre { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-bottom: 1px solid var(--bord); background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); position: sticky; top: 0; z-index: 5; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.01em; }
.logo svg { width: 28px; height: 28px; }
.recherche { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 280px; padding: 8px 12px; border: 1px solid var(--bord); border-radius: 11px; background: var(--surface); color: var(--doux); cursor: pointer; transition: border-color var(--t); }
.recherche:hover { border-color: var(--accent); }
.cote { border-right: 1px solid var(--bord); overflow: auto; background: var(--surface); }
.cote h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--doux); margin: 18px 16px 8px; }
.filtre { position: sticky; top: 0; padding: 12px; background: var(--surface); z-index: 1; }
.filtre input { width: 100%; padding: 9px 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--surface-2); outline: none; }
.filtre input:focus { border-color: var(--accent); }
.routes { list-style: none; margin: 0; padding: 0 8px 16px; }
.routes button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; transition: background var(--t); }
.routes button:hover { background: var(--surface-2); }
.routes button[aria-current=true] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.routes .cartouche { min-width: 52px; height: 26px; font-size: 13px; }
.routes small { color: var(--doux); display: block; line-height: 1.25; }

/* ===== L'axe ======================================================================= */
.centre { overflow: auto; scroll-behavior: smooth; position: relative; }
.entete { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: 1fr 240px 1fr; align-items: end; gap: 12px; padding: 16px 24px 12px; background: color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--bord); margin-bottom: 8px; }
.entete .titre { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.entete .titre h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.entete .titre .meta { color: var(--doux); font-size: 13px; }
.entete .gauche { justify-self: end; } .entete .droite, .pied .droite { justify-self: start; }
.entete .milieu, .pied .milieu { text-align: center; color: var(--doux); font-size: 12px; }
.options { display: flex; gap: 8px; margin-left: auto; }
.puce { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--bord); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; user-select: none; }
.puce input { accent-color: var(--accent); }
.axe { position: relative; padding: 0 24px 24px; }
.ligne { position: relative; display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; min-height: 96px; gap: 12px; border-radius: var(--r); transition: background var(--t); scroll-margin-top: 150px; }
.ligne:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.ligne[aria-current=true] { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.ligne.aire-l { min-height: 56px; }
.etiq { display: flex; flex-direction: column; gap: 2px; padding: 8px 4px; cursor: pointer; }
.etiq.g { align-items: flex-end; text-align: right; } .etiq.d { align-items: flex-start; }
.etiq .nom { font-weight: 700; font-size: 15px; }
.etiq .dest { color: var(--doux); font-size: 12.5px; max-width: 34ch; }
.schema { width: 240px; height: 100%; min-height: 96px; display: block; overflow: visible; }
.schema .voie { stroke: var(--chaussee); stroke-width: 10; stroke-linecap: butt; }
.schema .voie-trait { stroke: var(--surface); stroke-width: 1.5; stroke-dasharray: 6 8; }
.schema .geste { fill: none; stroke: var(--chaussee-fort); stroke-width: 7; stroke-linecap: round; cursor: pointer; transition: stroke var(--t), filter var(--t), stroke-width var(--t); }
.schema .geste.tronc { stroke: transparent; stroke-width: 22; }
.schema .geste.absent { stroke: var(--bord); stroke-dasharray: 2 6; cursor: not-allowed; }
.schema .geste:not(.absent):hover, .schema .geste.vu { stroke: var(--rouge); stroke-width: 9; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--rouge) 60%, transparent)); }
.schema .geste.tronc:not(.absent):hover, .schema .geste.tronc.vu { stroke: color-mix(in srgb, var(--ambre) 80%, transparent); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--ambre) 70%, transparent)); }
.schema .fleche { fill: var(--chaussee-fort); opacity: .55; }
.schema .pastille { fill: var(--surface); stroke: var(--texte); stroke-width: 2.5; }
.schema text { font: 800 11px ui-sans-serif, system-ui; fill: var(--texte); }
.ligne.terminus { min-height: 64px; }
.term { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px dashed var(--bord); border-radius: 12px; background: var(--surface); color: var(--texte); font-weight: 650; cursor: pointer; transition: border-color var(--t), transform var(--t); }
.term.g { justify-self: end; } .term.d { justify-self: start; }
.term:hover { border-color: var(--accent); transform: translateY(-1px); }
.term.sans { cursor: default; } .term.sans:hover { border-color: var(--bord); transform: none; }
.term-go { color: var(--accent); font-size: 20px; line-height: 1; }
.ov-bloc { max-width: 820px; margin: 24px auto; }
.ov { width: 100%; height: auto; display: block; }
.ov-montagne { fill: color-mix(in srgb, var(--doux) 18%, transparent); stroke: var(--bord); }
.ov-eau { fill: none; stroke: color-mix(in srgb, var(--accent) 45%, transparent); stroke-width: 6; stroke-linecap: round; }
.ov-voie rect { fill: var(--chaussee); transition: fill var(--t), filter var(--t); cursor: pointer; }
.ov-voie .ov-fleche { fill: none; stroke: var(--surface); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.ov-voie.vu rect, .ov-voie:hover:not(.absent) rect { fill: var(--rouge); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--rouge) 60%, transparent)); }
.ov-voie.absent rect { fill: var(--bord); cursor: not-allowed; }
.ov-portail { stroke: var(--texte); stroke-width: 5; stroke-linecap: round; }
.ov-pile { stroke: var(--doux); stroke-width: 6; stroke-linecap: round; }
.ov-frontiere { stroke: var(--ambre); stroke-width: 2; stroke-dasharray: 6 6; }
.ov-pays { font: 800 18px ui-sans-serif, system-ui; fill: var(--texte); }
.ov-ville { font: 600 13px ui-sans-serif, system-ui; fill: var(--doux); }
.voie-lib { color: var(--doux); font-size: 12.5px; font-weight: 600; }
.pied { position: sticky; bottom: 0; z-index: 3; display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; gap: 12px; padding: 12px 24px; background: color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--bord); }
.mini { position: absolute; right: 6px; top: 150px; bottom: 30px; width: 8px; border-radius: 8px; background: var(--surface-2); }
.mini i { position: absolute; left: 0; right: 0; height: 2px; background: var(--doux); opacity: .5; }
.mini b { position: absolute; left: -3px; right: -3px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 35%, transparent); border: 1px solid var(--accent); }

/* ===== Panneau de détail =========================================================== */
.detail { border-left: 1px solid var(--bord); background: var(--surface); overflow: auto; padding: 18px; }
.detail .vide { color: var(--doux); margin-top: 40px; text-align: center; }
.detail h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 19px; }
.detail .sous { color: var(--doux); font-size: 13px; margin-bottom: 14px; }
.bloc { border: 1px solid var(--bord); border-radius: var(--r); padding: 12px; margin-bottom: 12px; background: var(--surface); box-shadow: var(--ombre); }
.bloc .panneau { margin-bottom: 10px; font-size: 13px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 9px 11px; border: 1px solid var(--bord); border-radius: 12px; background: var(--surface-2); color: var(--texte); text-decoration: none; font-weight: 650; font-size: 14px; line-height: 1.15; transition: transform var(--t), border-color var(--t), background var(--t); }
.act:hover { border-color: var(--rouge); background: var(--rouge-doux); transform: translateY(-1px); }
.act:active { transform: scale(.98); }
.act.large { grid-column: 1 / -1; }
.act.off { opacity: .38; pointer-events: none; }
.act .k { margin-left: auto; }
.act svg { flex: none; width: 24px; height: 24px; }
.detail, .detail * { min-width: 0; }
.detail .act span, .g-act span { flex: 1; overflow-wrap: anywhere; }
.detail .act .k, .detail .act svg { flex: none; }
.detail .panneau { white-space: normal; max-width: 100%; }
.detail .actions { grid-template-columns: 1fr; }
.detail .term { width: 100%; justify-self: stretch; white-space: normal; text-align: left; }
.detail .term span:nth-child(2) { flex: 1; overflow-wrap: anywhere; }
.detail h3 { flex-wrap: wrap; overflow-wrap: anywhere; }
.lien-ids { margin-top: 8px; border: 0; background: none; color: var(--doux); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 4px 0; }
.aide { color: var(--doux); font-size: 12.5px; line-height: 1.6; }
.aide p { margin: 6px 0; }

/* ===== Bulle et palette ============================================================ */
.bulle { position: fixed; z-index: 20; pointer-events: none; padding: 8px 11px; border-radius: 10px; background: #0b1220; color: #fff; font-size: 13px; font-weight: 600; box-shadow: var(--ombre); opacity: 0; transform: translateY(4px); transition: opacity 90ms, transform 90ms; max-width: 280px; }
.bulle.vu { opacity: 1; transform: none; }
.bulle small { display: block; color: #a9b6cc; font-weight: 500; }
.palette { position: fixed; inset: 0; z-index: 30; display: none; place-items: start center; padding-top: 12vh; background: rgb(2 6 23 / .45); backdrop-filter: blur(3px); }
.palette.vu { display: grid; }
.palette .boite { width: min(640px, 92vw); border-radius: 16px; background: var(--surface); box-shadow: 0 24px 64px rgb(0 0 0 / .35); overflow: hidden; border: 1px solid var(--bord); }
.palette input { width: 100%; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--bord); background: none; font-size: 17px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 52vh; overflow: auto; }
.palette li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.palette li[aria-selected=true] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.palette li small { color: var(--doux); margin-left: auto; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(12px); padding: 10px 16px; border-radius: 12px; background: #0b1220; color: #fff; font-size: 14px; opacity: 0; transition: opacity var(--t), transform var(--t); z-index: 40; pointer-events: none; }
.toast.vu { opacity: 1; transform: translateX(-50%); }

/* ===== Téléphone : une seule colonne, un seul sens, des gestes gros comme le pouce ===== */
.mobile { display: none; }
@media (max-width: 860px) {
  .app { display: none; } .mobile { display: block; }
  .m-haut { position: sticky; top: 0; z-index: 5; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--bord); }
  .m-ligne1 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .m-route { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 48px; border: 1px solid var(--bord); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; }
  .m-route b { font-size: 16px; } .m-route small { color: var(--doux); display: block; }
  .m-sens { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
  .m-sens button { min-height: 50px; border: 0; border-radius: 11px; background: none; font-weight: 750; font-size: 16px; color: var(--doux); }
  .m-sens button[aria-pressed=true] { background: var(--panneau); color: #fff; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .85); }
  .m-q { width: 100%; margin-top: 8px; min-height: 46px; padding: 0 14px; border: 1px solid var(--bord); border-radius: 12px; background: var(--surface); font-size: 16px; outline: none; }
  .m-liste { padding: 10px 10px calc(30px + env(safe-area-inset-bottom)); }
  .m-carte { border: 1px solid var(--bord); border-radius: 16px; padding: 12px; margin-bottom: 10px; background: var(--surface); box-shadow: var(--ombre); }
  .m-carte .t { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .m-carte .t .nom { font-weight: 750; font-size: 17px; line-height: 1.2; }
  .m-carte .t small { color: var(--doux); display: block; font-size: 13px; }
  .m-carte .act { min-height: 58px; font-size: 15px; }
  .m-rang { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--bord); border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; box-shadow: var(--ombre); }
  .m-rang:active { transform: scale(.99); background: var(--surface-2); }
  .m-txt { flex: 1; min-width: 0; } .m-txt b { display: block; font-size: 17px; line-height: 1.2; }
  .m-txt small { display: block; color: var(--doux); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-n { min-width: 26px; height: 26px; display: grid; place-items: center; border-radius: 13px; background: var(--rouge-doux); color: var(--rouge); font-weight: 800; font-size: 13px; }
  .m-chev { color: var(--doux); font-size: 26px; line-height: 1; }
  .g-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; } .g-tete b { display: block; font-size: 19px; } .g-tete small { color: var(--doux); }
  .g-sens { margin-bottom: 12px; }
  .g-gestes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g-act { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 96px; padding: 14px; border: 1px solid var(--bord); border-radius: 18px; background: var(--surface-2); color: var(--texte); text-decoration: none; font-weight: 750; font-size: 16px; line-height: 1.2; }
  .g-act svg { width: 32px; height: 32px; } .g-act.large { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 72px; }
  .g-act:active { transform: scale(.98); background: var(--rouge-doux); }
  .g-act.off { opacity: .35; pointer-events: none; } .g-act.tout { border-color: var(--rouge); }
  .feuille { position: fixed; inset: 0; z-index: 30; display: none; background: rgb(2 6 23 / .45); }
  .feuille.vu { display: block; }
  .feuille .boite { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82dvh; overflow: auto; border-radius: 20px 20px 0 0; background: var(--surface); padding: 10px 12px calc(16px + env(safe-area-inset-bottom)); }
  .feuille .poignee { width: 44px; height: 5px; border-radius: 5px; background: var(--bord); margin: 4px auto 10px; }
  .feuille input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--bord); border-radius: 12px; background: var(--surface-2); font-size: 16px; margin-bottom: 8px; outline: none; }
  .feuille .routes button { min-height: 52px; }
}
/* téléphone : case « Aires et péages » (audit n° 13), cible ≥ 44 px */
.m-ligne1 { display: flex; align-items: center; gap: 8px; }
.m-aires { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--bord); border-radius: 999px; background: var(--surface); font-size: 14px; white-space: nowrap; }
.m-aires input { width: 20px; height: 20px; accent-color: var(--accent); }
.feuille .boite, .palette ul, .detail, .cote { overscroll-behavior: contain; }   /* le défilement d'un panneau n'entraîne pas la page */
/* téléphone, tablette : un champ sous 16 px fait zoomer iOS à la saisie (audit n° 32) */
@media (pointer: coarse) { input:not([type=checkbox]):not([type=range]), select { font-size: 16px; } }
/* compteur de gestes du téléphone : rouge foncé sur rose (5,5), rouge clair sur bordeaux (5,9) (contraste, audit n° 32) */
.m-n { color: #b91c1c; }
@media (prefers-color-scheme: dark) { .m-n { color: #f87171; } }
</style>
</head>
<body>

<!-- ================================ BUREAU ================================ -->
<div class="app" id="app">
  <header class="barre">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="#d91c2a"/><path d="M11 23V9M21 23V9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M16 11v3M16 18v3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      Fermer un échangeur <span style="color:var(--doux);font-weight:500">· Waze France</span>
    </div>
    <nav class="vues" id="vues" aria-label="Affichage"></nav>

/* ---------- Les deux sens réunis sur un seul axe : un rang = un échangeur ---------- */
// a : la chaussée qui va vers le sud (nord en haut de l'écran) ; b : celle qui remonte
function ordreSens(d) {
  const [x, y] = d.chaussees;
  if (!y || d.route.startsWith('anneau-')) return [x, y];
  // tendance générale : la chaussée qui perd le plus de latitude va vers le bas (même un axe presque
  // est-ouest a une pente qui tranche)
  const pente = c => c.fin[1] - c.debut[1];
  return pente(x) <= pente(y) ? [x, y] : [y, x];
}
function rangs(d, aires) {
  const [a, b] = ordreSens(d), La = a.km || 1, Lb = (b && b.km) || 1;
  const out = [];

  // un même bout vu des deux sens (« X (sortie seule) » / « X (entrée seule) », « Fin » / « Début de l’autoroute »,
  // « Vers » / « Depuis la N296 ») se retrouve par son nom ainsi ramené
  const nomCle = n => (n || '').replace(/\s*\((?:entrée|sortie) seule\)$/, '').replace(/^(?:Début|Fin) de l’autoroute$/, '·bout').replace(/^(?:Depuis|Vers) /, '');
  const cle = p => p.kind === 'echangeur' && p.num ? 'n' + p.num : p.kind === 'echangeur' && p.nom ? 'x' + nomCle(p.nom) : p.kind === 'bifurcation' ? 'b' + (p.nom || '').split(/[: ]/)[0] : null;
  const cache_ = p => !aires && (p.kind === 'aire' || p.kind === 'peage');
  for (const p of a.points) if (!cache_(p)) out.push({ pos: p.km, d: p, g: null });
  if (b) for (const q of b.points) {
    if (cache_(q)) continue;
    const pos = La - q.km * (La / Lb);
    const k = cle(q);
    const r = k && out.find(x => x.d && cle(x.d) === k && !x.g && Math.abs(x.pos - pos) < 8);
    if (r) r.g = q; else out.push({ pos, d: null, g: q });
  }
  return out.sort((x, y) => x.pos - y.pos);
}

}

  if (!g.classList.contains('absent')) g.classList.add('vu');
  bulle.innerHTML = esc(g.dataset.t) + '<small>' + (g.classList.contains('absent') ? 'pas de voie dans ce sens' : 'clic : ouvrir WME') + '</small>';
  bulle.style.left = Math.min(innerWidth - 300, ev.clientX + 16) + 'px'; bulle.style.top = (ev.clientY + 16) + 'px'; bulle.classList.add('vu');
});
$('axe').addEventListener('click', ev => { const g = ev.target.closest('.ov-voie'); if (g && g.dataset.l) ouvrir(JSON.parse(g.dataset.l)); });
$('axe').addEventListener('pointerout', ev => { if (ev.target.closest && ev.target.closest('.ov-voie') && !ev.relatedTarget?.closest?.('.ov-voie')) { document.querySelectorAll('.ov-voie.vu').forEach(x => x.classList.remove('vu')); bulle.classList.remove('vu'); } });

/* ---------- Interactions bureau ---------- */
const bulle = $('bulle');
$('axe').addEventListener('pointermove', ev => {
  const g = ev.target.closest('.geste');
  document.querySelectorAll('.geste.vu').forEach(x => { if (x !== g) x.classList.remove('vu'); });
  if (!g) { bulle.classList.remove('vu'); return; }
  const r = etat.rangs[+g.dataset.r], p = r[g.dataset.c], k = g.dataset.k;
  if (g.classList.contains('absent') || !p) { bulle.innerHTML = 'Rien à fermer ici<small>' + ({ sortie: 'pas de sortie', entree: 'pas d\'entrée', oblig: 'pas de tronçon' }[k]) + ' dans ce sens</small>'; }
  else {
    // au survol du tronçon : on montre aussi l'entrée, pour le cumul (Maj enfoncé)
    const cumul = k === 'oblig' && ev.shiftKey && p.f.deux;
    bulle.innerHTML = esc(cumul ? texteGeste('deux', p) : texteGeste(k, p)) + '<small>' + esc(p.nom) + ' · ' + (cumul ? p.f.deux : p.f[k]).ids.length + ' segment(s) · clic : ouvrir WME' + (k === 'oblig' && p.f.deux && !cumul ? ' · Maj : + entrée interdite' : '') + '</small>';
    g.classList.add('vu');
  }
  bulle.style.left = Math.min(innerWidth - 300, ev.clientX + 16) + 'px'; bulle.style.top = (ev.clientY + 16) + 'px';
  bulle.classList.add('vu');
});
$('axe').addEventListener('pointerleave', () => { bulle.classList.remove('vu'); document.querySelectorAll('.geste.vu').forEach(x => x.classList.remove('vu')); });
$('axe').addEventListener('click', ev => {
  const g = ev.target.closest('.geste');
  if (g && !g.classList.contains('absent')) {
    const r = etat.rangs[+g.dataset.r], p = r[g.dataset.c];
    ouvrir(g.dataset.k === 'oblig' && ev.shiftKey && p.f.deux ? p.f.deux : p.f[g.dataset.k]);
    choisir(+g.dataset.r); etat.cote = g.dataset.c; detail(); return;
  }
  const l = ev.target.closest('[data-r]'); if (l) { if (l.dataset.c) etat.cote = l.dataset.c; choisir(+l.dataset.r); }
});
$('centre').addEventListener('scroll', majMini, { passive: true });
$('mini').addEventListener('click', ev => { const r = $('mini').getBoundingClientRect(); const c = $('centre'); c.scrollTop = (ev.clientY - r.top) / r.height * c.scrollHeight - c.clientHeight / 2; });
document.addEventListener('click', ev => {
  const o = ev.target.closest('[data-ouvrage]'); if (o) { const id = o.dataset.ouvrage; fermerF(() => { ouvrage(id); mOuvrage(id); }); return; }
  const b = ev.target.closest('[data-route]'); if (b) { const d = b.dataset; fermerF(() => { etat.ouvrage = null; allerA(d.route, null, d.depuis || null, d.vers || null); }); return; }
  const c = ev.target.closest('[data-copie]'); if (c) navigator.clipboard.writeText(c.dataset.copie).then(() => toast('ID copiés'), () => toast('Copie impossible'));
});
$('filtre').oninput = e => filtrer(e.target.value);
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); palette(true); return; }
  if ($('palette').classList.contains('vu') || /input|textarea/i.test(document.activeElement.tagName)) return;
  if (!etat.rangs.length || etat.ouvrage) return;   // sur un ouvrage, ↑ ↓ et 1 à 5 n'agissent pas sur l'autoroute vue avant (audit n° 8)
  if (ev.key === 'ArrowDown' || ev.key === 'j') { ev.preventDefault(); choisir(Math.min(etat.rangs.length - 1, etat.sel + 1), true); }
  else if (ev.key === 'ArrowUp' || ev.key === 'k') { ev.preventDefault(); choisir(Math.max(0, etat.sel - 1), true); }
  // ← la chaussée de GAUCHE (sens d, ↓), → celle de DROITE (sens g, ↑) : elles étaient inversées (audit n° 3)
  else if (ev.key === 'ArrowLeft') { etat.cote = 'd'; detail(); }
  else if (ev.key === 'ArrowRight') { etat.cote = 'g'; detail(); }
  else if (/^[1-5]$/.test(ev.key) && etat.sel >= 0) {
    const p = etat.rangs[etat.sel][etat.cote]; if (!p) return;
    ouvrir(p.f[['entree', 'sortie', 'oblig', 'deux', 'tout'][+ev.key - 1]]);
  }
});

/* ---------- Palette (Ctrl K) : autoroutes et échangeurs ---------- */
let pRes = [], pSel = 0;
function palette(ouvre) {
  $('palette').classList.toggle('vu', ouvre);
  if (ouvre) { $('pQ').value = ''; pRemplir(); setTimeout(() => $('pQ').focus(), 0); }
}
async function pRemplir() {
  const q0 = sansAcc($('pQ').value.trim());
  // « A7 21 », « a51 vif » : une autoroute puis un numéro ou un nom
  const mr = q0.match(/^((?:a|n)\d+[a-z]?)\s+(.+)$/), rq = mr ? mr[1].toUpperCase() : null, q = mr ? mr[2] : q0;
  pRes = [];
  if (q) {
    const I = await index();
    for (const [r, num, nom, dest, k] of I) {
      if (rq && r !== rq) continue;
      const t = sansAcc(num + ' ' + nom + ' ' + dest);
      if (t.includes(q) || (num && sansAcc(num) === q)) {
        if (r.startsWith('ouvrage:')) pRes.push({ ouvrage: r.slice(8), route: null, txt: nom, sous: dest || 'ouvrage' });
        else pRes.push({ route: r, num: num || nom, nom, txt: (num ? num + ' · ' : '') + nom, sous: (infos(r) ? (infos(r).anneau ? infos(r).titre : r) : r) + (dest ? ' · ' + dest : '') });
      }
      if (pRes.length > 60) break;
    }
  }
  const routes = rq ? [] : DONNEES.liste.filter(r => !q || sansAcc(r.route + ' ' + r.titre + ' ' + r.sens.join(' ')).includes(q)).map(r => ({ route: r.route, txt: (r.anneau ? r.titre : r.route), sous: r.sens.join(' ↔ ') }));
  // sans saisie : TOUTES les autoroutes (la liste était coupée à 40) ; avec saisie : routes puis échangeurs
  pRes = q ? routes.concat(pRes).slice(0, 80) : routes; pSel = 0; pDessin();
}
// icône d'un ouvrage : ⛰ pour un tunnel, un pont en arc pour un pont (audit n° 34 : ⛰ sur les ponts) ; texte = pour un <option>
const icoOuv = (t, texte) => t !== 'pont' ? '⛰' : texte ? '🌉' : '<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-label="pont" role="img"><path d="M2 15h20M4 15v5M20 15v5M4 15a8 7 0 0 1 16 0M8 15V9M12 15V8M16 15V9"/></svg>';
function pDessin() { $('pListe').innerHTML = pRes.map((x, i) => '<li role="option" id="pOpt' + i + '" data-i="' + i + '" aria-selected="' + (i === pSel) + '">' + (x.ouvrage ? '<span class="cartouche" style="background:#334155;min-width:40px;height:24px;font-size:12px">' + icoOuv(((DONNEES.ouvrages || []).find(o => o.id === x.ouvrage) || {}).type) + '</span>' : badge(x.route, true)) + '<span>' + esc(x.txt) + '</span><small>' + esc(x.sous) + '</small></li>').join('') || '<li>Aucun résultat</li>'; $('pQ').setAttribute('aria-activedescendant', pRes.length ? 'pOpt' + pSel : ''); }
$('pQ').oninput = pRemplir;
$('pQ').onkeydown = ev => {
  if (ev.key === 'ArrowDown') { pSel = Math.min(pRes.length - 1, pSel + 1); pDessin(); ev.preventDefault(); }
  else if (ev.key === 'ArrowUp') { pSel = Math.max(0, pSel - 1); pDessin(); ev.preventDefault(); }
  else if (ev.key === 'Enter' && pRes[pSel]) { palette(false); const x = pRes[pSel]; x.ouvrage ? ouvrage(x.ouvrage) : allerA(x.route, x.num, null, null, x.nom); }
  else if (ev.key === 'Escape') palette(false);
};
$('pListe').onclick = ev => { const li = ev.target.closest('li[data-i]'); if (li) { const x = pRes[+li.dataset.i]; palette(false); x.ouvrage ? ouvrage(x.ouvrage) : allerA(x.route, x.num, null, null, x.nom); } };
$('palette').onclick = ev => { if (ev.target === $('palette')) palette(false); };
$('ouvrirPalette').onclick = () => palette(true);

/* ---------- Téléphone ---------- */
// Retour d'Android (audit n° 32) : une feuille ouverte prend une place dans l'historique ; Retour la referme au lieu de quitter le site.
// Un choix fait dans la feuille attend d'être revenu à l'entrée d'avant : vues.js y réécrit l'adresse (?r=…) par replaceState.
const FEUILLES = ['feuille', 'gestes'];
function ouvrirF(id) { $(id).classList.add('vu'); if (!(history.state && history.state.fe)) history.pushState(Object.assign({}, history.state, { fe: 1 }), ''); }
function fermerF(puis) {
  if (history.state && history.state.fe) { fermerF.puis = puis; history.back(); return; }
  FEUILLES.forEach(id => $(id).classList.remove('vu')); if (puis) puis();
}
addEventListener('popstate', () => { FEUILLES.forEach(id => $(id).classList.remove('vu')); const f = fermerF.puis; fermerF.puis = null; if (f) f(); });
// page rechargée feuille ouverte : l'entrée garde fe, sans feuille affichée ⇒ on l'efface (sinon Retour quitterait le site)
if (history.state && history.state.fe) { const s = Object.assign({}, history.state); delete s.fe; history.replaceState(s, ''); }
function mobileRendu() {
  const d = etat.data, i = infos(etat.route); if (!d || !i) return;
  $('mQ').style.display = '';
  $('mRoute').innerHTML = badge(etat.route) + '<span><b>' + esc(i.anneau ? i.titre : 'Autoroute ' + etat.route) + '</b><small>Changer d\'autoroute ▾</small></span>';
  if (etat.sensMobile >= d.chaussees.length) etat.sensMobile = 0;
  $('mAires').checked = !!etat.aires;
  $('mSens').innerHTML = d.chaussees.map((c, k) => '<button type="button" data-s="' + k + '" aria-pressed="' + (k === etat.sensMobile) + '">→ ' + esc(c.vers) + '</button>').join('');
  mListe();
}
function mListe() {
  const ch = etat.data.chaussees[etat.sensMobile], q = sansAcc($('mQ').value.trim());
  // une recherche remplie trouve aussi les aires et péages, même masqués (audit n° 13)
  etat.mPts = ch.points.filter(p => (etat.aires || q || (p.kind !== 'aire' && p.kind !== 'peage')) && (!q || sansAcc(p.num) === q || sansAcc(p.num).startsWith(q) || sansAcc(p.nom).includes(q) || sansAcc((p.dest || []).join(' ')).includes(q)));
  $('mListe').innerHTML = etat.mPts.map((p, i) => {
    const n = GESTES.filter(g => p.f[g.k]).length + (p.f.tout ? 1 : 0);
    return '<button class="m-rang" type="button" data-m="' + i + '">' + pastille({ d: p }) + '<span class="m-txt"><b>' + esc(p.nom) + '</b><small>' + esc((p.dest || []).join(', ') || (p.lien && p.lien.vers ? 'vers ' + p.lien.vers : '') || 'km ' + Math.round(p.km)) + '</small></span><span class="m-n">' + n + '</span><span class="m-chev">›</span></button>';
  }).join('') || '<p class="aide" style="text-align:center;padding:40px 0">Aucun échangeur ne correspond.</p>';
}
function mGestes(i) {
  const p = etat.mPts[i], ch = etat.data.chaussees[etat.sensMobile];
  const tous = [...new Set(Object.values(p.f).filter(Boolean).flatMap(l => l.ids))];
  $('gBoite').innerHTML = '<div class="poignee"></div><div class="g-tete">' + pastille({ d: p }) + '<div><b>' + esc(p.nom) + '</b><small>' + esc((p.dest || []).join(', ')) + '</small></div></div>'
    + '<div class="g-sens"><span class="panneau">→ ' + esc(ch.vers) + '</span></div><div class="g-gestes">'
    + GESTES.map(g => { const l = p.f[g.k]; if (g.k === 'deux' && !l) return ''; return l ? '<a class="g-act' + (g.large ? ' large' : '') + '" href="' + esc(lien(l)) + '" target="_blank" rel="noopener">' + g.ico + '<span>' + esc(texteGeste(g.k, p)) + '</span></a>' : '<span class="g-act off' + (g.large ? ' large' : '') + '">' + g.ico + '<span>' + esc(texteGeste(g.k, p)) + '</span></span>'; }).join('')
    + (p.f.tout ? '<a class="g-act large tout" href="' + esc(lien(p.f.tout)) + '" target="_blank" rel="noopener">' + ICO.interdit + ICO.interdit + '<span>' + esc(libTout(p, ch.vers)) + '</span></a>' : '')
    + '</div>' + noteSansSortie(p) + lienBif(p) + '<button class="lien-ids" type="button" data-copie="' + tous.join(',') + '">Copier les ID des segments</button>';
  ouvrirF('gestes');
}
$('mListe').onclick = ev => { const b = ev.target.closest('[data-m]'); if (b) mGestes(+b.dataset.m); };
$('mSens').onclick = ev => { const b = ev.target.closest('[data-s]'); if (!b) return; etat.sensMobile = +b.dataset.s; retenir(); mobileRendu(); scrollTo({ top: 0 }); };
$('mQ').oninput = mListe;
$('mAires').onchange = e => { etat.aires = e.target.checked; retenir(); mListe(); if (etat.data) dessiner(); };
$('mRoute').onclick = () => { ouvrirF('feuille'); $('fQ').value = ''; fListe(); };
$('feuille').onclick = ev => { if (ev.target === $('feuille')) fermerF(); };
$('gestes').onclick = ev => { if (ev.target === $('gestes') || ev.target.closest('.g-act:not(.off)')) fermerF(); };
function fListe() {
  const f = $('fQ').value.trim().toLowerCase();
  const fo = (DONNEES.ouvrages || []).filter(o => !f || sansAcc(o.titre + ' ' + (o.route || '')).includes(sansAcc(f))).map(o => '<li><button type="button" data-ouvrage="' + esc(o.id) + '"><span class="cartouche" style="background:#334155">' + icoOuv(o.type) + '</span><span><b>' + esc(o.titre) + '</b><small>' + esc(o.route || '') + '</small></span></button></li>').join('');
  $('fListe').innerHTML = DONNEES.liste.filter(r => !f || sansAcc(r.route + ' ' + r.titre + ' ' + r.sens.join(' ')).includes(sansAcc(f)) || (ROUTES_TROUVEES && ROUTES_TROUVEES.has(r.route))).map(r => '<li><button type="button" data-route="' + esc(r.route) + '">' + badge(r.route) + '<span><b>' + esc(r.anneau ? r.titre : r.route) + '</b><small>' + esc(r.sens.join(' ↔ ')) + '</small></span></button></li>').join('');
  $('fListe').innerHTML = fo + $('fListe').innerHTML;   // ouvrages en TÊTE, comme sur ordinateur (décision de l'auteur)
}
async function mOuvrage(id) {
  if (!cache.__ouvrages) cache.__ouvrages = await fetch('d/ouvrages.json').then(x => x.json());
  const o = cache.__ouvrages.find(x => x.id === id); if (!o) return;
  $('mRoute').innerHTML = '<span class="cartouche" style="background:#334155">' + icoOuv(o.type) + '</span><span><b>' + esc(o.titre) + '</b><small>Changer ▾</small></span>';
  $('mSens').innerHTML = ''; $('mQ').style.display = 'none';
  $('mListe').innerHTML = '<div class="g-gestes">' + (o.sens || []).filter(Boolean).map(x => '<a class="g-act" href="' + esc(lien(x.f)) + '" target="_blank" rel="noopener">' + ICO.interdit + '<span>Fermé vers ' + esc(x.vers) + '</span></a>').join('') + '<a class="g-act large tout" href="' + esc(lien(o.tout)) + '" target="_blank" rel="noopener">' + ICO.interdit + ICO.interdit + '<span>Fermé dans les deux sens</span></a></div>' + (o.double_sens ? '<p class="aide">Segment à double sens : choisissez la direction dans la fenêtre de fermeture de WME.</p>' : '');
}
$('fQ').oninput = async () => { const q = sansAcc($('fQ').value.trim()); ROUTES_TROUVEES = null; if (q.length >= 3) { const I = await index(); ROUTES_TROUVEES = new Set(I.filter(x => sansAcc(x[2] + ' ' + x[3]).includes(q)).map(x => x[0])); } fListe(); };

/* ---------- Démarrage ---------- */
listeRoutes('');
// la dernière autoroute vue (ou celle de l'adresse ?r=…), commune aux trois vues
FE_VUES.init('lineaire');
{
  const ov0 = FE_VUES.departOuvrage((DONNEES.ouvrages || []).map(o => o.id));
  if (ov0) { ouvrage(ov0); if (typeof mOuvrage === 'function') mOuvrage(ov0); }
  else allerA(FE_VUES.depart(DONNEES.liste.map(x => x.route), 'A9'));
}
</script>
