<script>
// Ouvre la DERNIÈRE VUE utilisée (Carte, Linéaire ou Tableau), sur la dernière autoroute vue ; la première fois : la
// carte, sauf sur un téléphone, où la vue linéaire est faite pour le pouce. L'adresse ?r=… est transmise telle quelle.
(() => {
  let v = null;
  try { v = localStorage.getItem('fe-vue'); } catch (e) {}
  // téléphone : TOUJOURS la vue linéaire (faite pour le pouce), même si une autre vue a été retenue un jour (lien partagé,
  // écran en paysage) — décision de l'auteur, audit n° 19 ; ailleurs : la dernière vue, la carte la première fois
  const tel = matchMedia('(max-width: 860px)').matches;
  if (tel) v = 'lineaire';
  else if (!['carte', 'lineaire', 'tableau'].includes(v)) v = 'carte';
  location.replace(v + '.html' + location.search);
})();
</script>
